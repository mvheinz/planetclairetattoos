# Docker-Exit-Pfad (ARCHITEKTUR §13): Produktion ohne Vercel. Start:
#   cp .env.production.example .env.production   (ausfüllen)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# Genau EINE App-Instanz (Dateisystem-Cache, §13.2). Postgres veröffentlicht keinen Port.
name: planetclaire

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: planetclaire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: planetclaire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planetclaire -d planetclaire']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    image: planetclaire-migrator
    restart: 'no'
    logging: *logging
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    image: planetclaire
    restart: unless-stopped
    logging: *logging
    env_file: ${ENV_FILE:-.env.production}
    environment:
      JOBS_AUTORUN: 'true'
      DB_POOL_MAX: '10'
      NEXT_PUBLIC_ANALYTICS_ENABLED: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - nextcache:/app/.next/cache
      - appdata:/app/.data # nur bei STORAGE_DRIVER=local
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  # Nächtliches Backup (§10.3): BusyBox-Cron ruft dieselbe Route wie Vercel Cron; sie antwortet 404, solange
  # BACKUP_ENABLED nicht gesetzt ist.
  scheduler:
    image: alpine:3
    restart: unless-stopped
    logging: *logging
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET fehlt}
    command:
      - sh
      - -c
      - |
        echo '30 1 * * * wget -q -O- --header "Authorization: Bearer '"$$CRON_SECRET"'" http://app:3000/api/cron/backup >/dev/null 2>&1' > /etc/crontabs/root
        exec crond -f -l 8
    depends_on:
      - app

volumes:
  pgdata:
  nextcache:
  appdata:
  caddy_data:
