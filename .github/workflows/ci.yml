name: CI

# Seit U-65 nur per Hand – Prüfungen laufen lokal (pnpm ci:local). Keine automatischen Auslöser (keine Actions-Minuten);
# der Inhalt bleibt als Vorlage (ARCHITEKTUR §6, docs/KONZEPT-OHNE-ACTIONS.md).

# ARCHITEKTUR §6.2/§6.3: nur über den offenen PR oder per Hand, nie bei push auf main.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal: Code lesen; `actions: read` für den Budget-Schritt (Artefakt-Liste, §6.2).
permissions:
  contents: read
  actions: read

jobs:
  quick:
    name: quick
    runs-on: ubuntu-latest
    # 45 statt 30 min: Seit P5 dauern die Integrationstests lang (P5 ~21 min, mit dem vollen Beispielbestand P8 > 40 min,
    # Lauf 37167124034 brach im Schritt „Integrationstests“ ab). Deshalb laufen sie mit `PC_INT_WORKERS=3` parallel, je Worker
    # eine Datenbankkopie (tests/int/setup/workers.ts); der ganze Job war in P4 schon 27–29 min lang und lief in P5 in die
    # 30-min-Grenze – GitHub meldet das als „cancelled“ (Läufe 36977115759, 36988931029, 36997806598).
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planetclaire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      TZ: UTC
      ADMIN_ROUTE: /werkstatt
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/planetclaire_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/planetclaire_test
      DB_POOL_MAX: '25'
      PC_INT_WORKERS: '3'
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_PREVIEW_MODE: 'true'
      SEED_NOW: '2026-10-15T10:00:00+02:00'
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-only-password-2026
      STORAGE_DRIVER: local
      EMAIL_DRIVER: file
      PAYMENTS_DRIVER: mock
      TRANSLATION_DRIVER: mock
      CARRIER_DRIVER: manual
      CRON_SECRET: ci-only-cron-secret-000000000000000000
      NEXT_PUBLIC_LEASH_DEBUG: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_SERVER: start
    steps:
      # Kennung (§6.2): bei [ci:update-snapshots] und [ci:art] entfällt quick. Bei `[ci:full` (P14.13, §6.8) läuft quick
      # kurz: Integrationstests, Build/Budgets und Rauchtest übernimmt ci-full.yml (quality: test:coverage = Unit + Int,
      # Build + check:bundle + check:external; e2e-full: alle @smoke-Tests); quick prüft Unit-Tests dann in Berliner Zeit.
      - name: Kennung
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            msg=$(gh api "repos/${{ github.repository }}/commits/$sha" --jq .commit.message)
          else
            sha="${{ github.sha }}"
            msg=""
          fi
          echo "sha7=${sha:0:7}" >> "$GITHUB_OUTPUT"
          if echo "$msg" | grep -qE '\[ci:update-snapshots\]|\[ci:art\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "quick übersprungen (Kennung im Kopf-Commit)" >> "$GITHUB_STEP_SUMMARY"
          elif echo "$msg" | grep -qF '[ci:full'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "quick kurz: Int-Tests, Build/Budgets und Rauchtest laufen in ci-full.yml (§6.8)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mode.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks prüft die Commits des PR
      - if: steps.mode.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.mode.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Installation
        if: steps.mode.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.mode.outputs.skip != 'true'
        run: pnpm run lint
      - name: Typen
        if: steps.mode.outputs.skip != 'true'
        run: pnpm run typecheck
      - name: Statische Prüfungen
        if: steps.mode.outputs.skip != 'true'
        run: pnpm run check:static
      - name: Unit-Tests
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        run: pnpm run test:unit
      # P4.2/P10.1: Unit-Tests zusätzlich in Berliner Ortszeit (Fristen, Summen, Steuer dürfen nicht von TZ abhängen).
      # Nur beim vollen Lauf – in UTC laufen sie dann in quality (test:coverage); früher je E2E-Job (6×, P14.13).
      - name: Unit-Tests mit TZ=Europe/Berlin
        if: steps.mode.outputs.full == 'true'
        env:
          TZ: Europe/Berlin
        run: pnpm run test:unit
      - name: Migrationen
        if: steps.mode.outputs.skip != 'true'
        run: pnpm run db:ensure && pnpm payload migrate && pnpm run check:migrations
      # Playwright-Chromium vor den Integrationstests: der Vorschau-Export-Test (AK-A-14-01) braucht ihn (ARCHITEKTUR §14.1).
      - name: Playwright-Version
        id: pw
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright-Browser-Cache
        id: pw-cache
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ steps.pw.outputs.version }}
      - name: Playwright Chromium + WebKit
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        # Immer installieren (lädt nichts nach, was im Cache liegt); Schlüssel je Browser-Satz, damit ein
        # Chromium-only-Cache nie einem WebKit-Job WebKit vorenthält.
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Integrationstests
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        run: pnpm run test:int
      - name: Next.js-Cache
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Seed + Build
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        run: pnpm run seed && pnpm run build
      - name: Budgets
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        run: pnpm run check:bundle && pnpm run check:external --built
      - name: E2E-Rauchtest
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.full != 'true'
        run: pnpm run test:e2e --grep @smoke --project=desktop --project=iphone-15
      - name: Geheimnis-Scan
        if: steps.mode.outputs.skip != 'true'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="$range"
          else
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner
          fi
      - name: Abhängigkeiten
        if: steps.mode.outputs.skip != 'true'
        run: |
          if ! pnpm audit --prod --audit-level=high; then
            echo "Warnung: pnpm audit meldet Lücken der Stufe high (blockiert nur bei critical, §8.10)." >> "$GITHUB_STEP_SUMMARY"
          fi
          pnpm audit --prod --audit-level=critical
      # Bei Fehler (§6.2): erst der Budget-Schritt, dann – nur bei upload_optional=true – der Fehlerbericht (2 Tage).
      - name: Artefakt-Budget
        id: budget
        if: failure() && steps.mode.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pnpm run ci:artifacts
      - name: Fehlerbericht hochladen
        if: failure() && steps.budget.outputs.upload_optional == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-report-${{ steps.mode.outputs.sha7 }}
          path: |
            playwright-report/
            test-results/
          retention-days: 2
          if-no-files-found: ignore
