name: CI

on:
  # P0: einmal auf main prüfen. P1.1a stellt auf pull_request + workflow_dispatch um (ARCHITEKTUR §6.2).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planetclaire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      ADMIN_ROUTE: /werkstatt
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/planetclaire
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_PREVIEW_MODE: 'true'
      STORAGE_DRIVER: local
      EMAIL_DRIVER: file
      PAYMENTS_DRIVER: mock
      TRANSLATION_DRIVER: mock
      CRON_SECRET: ci-only-cron-secret-000000000000000000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:int
      - run: pnpm run build
