<svg xmlns="http://www.w3.org/2000/svg" width="320" height="176" viewBox="0 0 320 176" role="img" aria-label="Harmonised notice: legal guarantee – at least two years for goods sold in the EU (placeholder version)">
  <!-- Harmonisierte Mitteilung zur gesetzlichen Gewährleistung (DVO (EU) 2025/1960 Anhang I, R-049, U-45/P13.6):
       PLATZHALTER-FASSUNG mit den Kernaussagen der Mitteilung, bis die amtliche Grafik (Kommission, „EU notice in all EU
       languages“) eingebaut und von der Kanzlei geprüft ist (K-19, Gate R-210, OFFENE-PUNKTE P13.6). Keine eigene
       Nachbildung des amtlichen Logos. -->
  <rect x="1" y="1" width="318" height="174" rx="8" fill="#FFFFFF" stroke="#003399" stroke-width="2"/>
  <path d="M1 9a8 8 0 0 1 8-8h302a8 8 0 0 1 8 8v31H1z" fill="#003399"/>
  <text x="160" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">LEGAL GUARANTEE</text>
  <text x="70" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#003399">AT LEAST</text>
  <text x="70" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#003399">2 YEARS</text>
  <line x1="138" y1="52" x2="138" y2="128" stroke="#003399" stroke-width="1"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F1B16">
    <tspan x="150" y="62">for goods sold in the</tspan>
    <tspan x="150" y="80">European Union.</tspan>
    <tspan x="150" y="98">Your rights are</tspan>
    <tspan x="150" y="116">against the seller.</tspan>
  </text>
  <line x1="12" y1="142" x2="308" y2="142" stroke="#4B463F" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="160" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4B463F">Placeholder version · official graphic to follow</text>
</svg>
