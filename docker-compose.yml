# Lokale Entwicklung: Postgres + Mail-Fänger. Start: `docker compose up -d`
# (In der Claude-Cloud-Umgebung läuft Postgres als Systemdienst, siehe docs/CLOUD-SETUP.md.)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planetclaire
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web-Oberfläche: http://localhost:8025

  # Profil `s3` (ARCHITEKTUR §3.3): lokaler S3-Test mit MinIO. Start: `docker compose --profile s3 up -d`,
  # dann in `.env`: STORAGE_DRIVER=s3, S3_ENDPOINT=http://127.0.0.1:9000, S3_BUCKET=pct-media-dev,
  # S3_PRIVATE_BUCKET=pct-private-dev, S3_ACCESS_KEY_ID=minioadmin, S3_SECRET_ACCESS_KEY=minioadmin.
  # Ist das Image nicht erhältlich, geht jeder MinIO-kompatible Ersatz über MINIO_IMAGE (siehe docs/OFFENE-PUNKTE.md).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3-API
      - '9001:9001' # Web-Oberfläche: http://localhost:9001
    volumes:
      - miniodata:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    profiles: ['s3']
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/pct-media-dev;
      mc mb --ignore-existing local/pct-private-dev;
      mc anonymous set none local/pct-media-dev;
      mc anonymous set none local/pct-private-dev;
      "

  # Profil `payments` (ARCHITEKTUR §3.5): zustandsloser Stripe-Nachbau für Form-/Parameter-Tests.
  # Start: `docker compose --profile payments up -d`; der Kontrakttest nutzt http://127.0.0.1:12111 (oder
  # STRIPE_API_BASE_URL). Version gepinnt: v0.205.0 bringt die OpenAPI-Version 2026-08-26.dahlia = STRIPE_API_VERSION
  # (P4.5) – beim SDK-Update gemeinsam ändern.
  stripe-mock:
    image: stripe/stripe-mock:v0.205.0
    profiles: ['payments']
    ports:
      - '12111:12111' # HTTP
      - '12112:12112' # HTTPS

volumes:
  pgdata:
  miniodata:
