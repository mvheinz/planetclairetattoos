# gitleaks-Konfiguration (ARCHITEKTUR §6.3 Schritt 11): Standardregeln plus Ausnahmen für erfundene Testwerte.
# Tests und Doku enthalten absichtlich Schein-Schlüssel (z. B. `sk_live_TESTVALUEONLY`, `ci-only-…`), damit Prüfungen
# gegen echte Schlüssel greifen. Echte Schlüssel gehören nie ins Repo (CLAUDE.md §6).
title = "planetclairetattoos"

[extend]
useDefault = true

[[allowlists]]
description = "Erfundene Testwerte in Tests und Beispiel-Befehle in der Doku"
paths = [
  '''^tests/''',
  '''^docs/''',
]

[[allowlists]]
description = "Wegwerf-Werte der CI (nur Testdatenbank, Präfix ci-only-)"
regexTarget = "match"
regexes = [
  '''ci-only-[A-Za-z0-9-]+''',
]

[[allowlists]]
# generic-api-key hält Schlüssel-Namen wie `key: 'dispute_vsbg37'` (Kennung einer Textvorlage, kein Geheimnis)
# für einen API-Schlüssel. Eng begrenzt: nur diese Datei UND nur reine snake_case-Kennungen hinter `key:`.
description = "Kennungen (snake_case) der Rechtstext-Vorlagen in src/lib/legal/templates.ts"
condition = "AND"
regexTarget = "match"
paths = [
  '''^src/lib/legal/templates\.ts$''',
]
regexes = [
  '''^key:\s*'[a-z][a-z0-9_]*'$''',
]
